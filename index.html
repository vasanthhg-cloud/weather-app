<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, modern weather app powered by the free Open-Meteo API." />
  <title>Skyline — Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Animated background layers -->
  <div class="bg" aria-hidden="true">
    <div class="bg__gradient"></div>
    <div class="bg__glow bg__glow--1"></div>
    <div class="bg__glow bg__glow--2"></div>
    <div class="bg__stars"></div>
    <canvas class="bg__canvas" id="weatherCanvas"></canvas>
  </div>

  <main class="app">
    <header class="app__header">
      <div class="brand">
        <span class="brand__mark">◐</span>
        <span class="brand__name">Skyline</span>
      </div>
      <form class="search" id="searchForm" autocomplete="off">
        <input
          class="search__input"
          id="searchInput"
          type="text"
          placeholder="Search a city…"
          aria-label="Search a city"
        />
        <button class="search__btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="search__geo" type="button" id="geoBtn" title="Use my location" aria-label="Use my location">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </button>
      </form>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">Loading…</p>

    <section class="current card" id="current" hidden>
      <div class="current__main">
        <div class="current__place">
          <h1 class="current__city" id="cityName">—</h1>
          <p class="current__time" id="localTime">—</p>
        </div>
        <div class="current__temp-wrap">
          <div class="current__icon" id="currentIcon">☀️</div>
          <div class="current__temp">
            <span id="currentTemp">—</span><span class="deg">°</span>
          </div>
        </div>
        <p class="current__desc" id="currentDesc">—</p>
        <p class="current__feels" id="currentFeels">—</p>
      </div>

      <div class="metrics">
        <div class="metric">
          <span class="metric__label">Humidity</span>
          <span class="metric__value" id="mHumidity">—</span>
        </div>
        <div class="metric">
          <span class="metric__label">Wind</span>
          <span class="metric__value" id="mWind">—</span>
        </div>
        <div class="metric">
          <span class="metric__label">Precipitation</span>
          <span class="metric__value" id="mPrecip">—</span>
        </div>
        <div class="metric">
          <span class="metric__label">Sunrise / Sunset</span>
          <span class="metric__value" id="mSun">—</span>
        </div>
      </div>
    </section>

    <section class="panel card" id="hourlyPanel" hidden>
      <h2 class="panel__title">Next 24 hours</h2>
      <div class="hourly" id="hourly"></div>
    </section>

    <section class="panel card" id="dailyPanel" hidden>
      <h2 class="panel__title">7-day forecast</h2>
      <div class="daily" id="daily"></div>
    </section>

    <footer class="app__footer">
      <span>Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></span>
      <span class="dot">•</span>
      <span>Built with vanilla JS</span>
    </footer>
  </main>

  <script src="background.js"></script>
  <script src="app.js"></script>
</body>
</html>
